[package]
name = "gitbrain-mem"
version = "0.1.0"
edition = "2021"
description = "Local, verbatim, structured shared memory (wings / rooms / drawers) for AI agents, with a CLI and an MCP stdio server."
license = "MIT"
repository = "https://github.com/HaraldSigvartsen/gitbrain"
publish = false

[[bin]]
name = "gitbrain-mem"
path = "src/main.rs"

[features]
default = []
# Local multilingual embeddings (fastembed / ONNX Runtime) for hybrid search.
# Downloads the model (~470 MB) on first use into ~/.gitbrain/models.
embed = ["dep:fastembed"]

[dependencies]
fastembed = { version = "7.5", optional = true, default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.27"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
